[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crackweb-mcp"
version = "0.3.2"
description = "MCP server that turns the crackweb CLI into tools an agent can call"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "coolmoon" }, { name = "guaidao2" }]
keywords = ["mcp", "model-context-protocol", "dast", "security", "crackweb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["mcp>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
crackweb-mcp = "crackweb_mcp.server:main"

[project.urls]
Homepage = "https://github.com/guaidao2/crackweb-mcp"
Upstream = "https://github.com/guaidao2/crackweb"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
