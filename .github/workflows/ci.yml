name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms matter: the wrapper owns processes, and stopping one is where the two
    # differ — a signal on POSIX, a console control event on Windows.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip pytest mcp
      - name: Test
        run: python -m pytest -q
